name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker/php/**'
      - 'compose.yaml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/php/**'
      - 'compose.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, intl, bcmath, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: cd backend && composer install --no-interaction --no-progress
      - run: cd backend && vendor/bin/pint --test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cetix
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: cetix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cetix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, intl, bcmath, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: cd backend && composer install --no-interaction --no-progress
      - run: cd backend && php artisan test
